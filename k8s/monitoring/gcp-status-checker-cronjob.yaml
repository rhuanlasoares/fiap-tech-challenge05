apiVersion: batch/v1
kind: CronJob
metadata:
  name: gcp-status-checker-cron
  namespace: monitoring-ns
  labels:
    app: gcp-status-checker
spec:
  schedule: '*/1 * * * *'
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app: gcp-status-checker
    spec:
      template:
        metadata:
          labels:
            app: gcp-status-checker
        spec:
          serviceAccountName: sa-gke
          containers:
          - name: checker
            image: southamerica-east1-docker.pkg.dev/ces-igniteprogram/artreg-status/gcp-status-checker:latest
            imagePullPolicy: Always
            env:
            - name: TARGET_SERVICES
              value: Cloud SQL,Google Kubernetes Engine,Compute Engine,Cloud Storage,Artifact
                Registry
            - name: TARGET_REGION
              value: southamerica-east1
            - name: SIMULATION_MODE
              value: 'false'
            - name: SIMULATED_OUTAGE_SERVICES
              value: Cloud SQL
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: opentelemetry-collector.monitoring-ns.svc.cluster.local:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: 'true'
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=monitoring-ns,deployment.environment=production,service.name=gcp-status-checker
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: otlp
            - name: OTEL_SERVICE_NAME
              value: gcp-status-checker
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 100m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
