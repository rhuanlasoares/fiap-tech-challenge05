apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: volunteer-ns

resources:
- analysis-template.yaml
- rollout.yaml
- health-check.yaml
- hpa.yaml
- netpol.yaml
- pdb.yaml
- secret.yaml
- service_account.yaml
- service.yaml

labels:
- includeSelectors: true
  pairs:
    app: volunteer-service

images:
- name: volunteer-service
  newName: southamerica-east1-docker.pkg.dev/ces-igniteprogram/artreg-volunteer-sa/volunteer-service
  newTag: latest