apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: volunteer-hpa
  namespace: volunteer-ns
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: volunteer-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80