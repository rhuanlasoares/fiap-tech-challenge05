apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ngo-service
  namespace: ngo-ns
  labels:
    app: ngo-service
spec:
  replicas: 3
  strategy:
    canary:
      analysis:
        templates:
        - templateName: ngo-golden-signals-analysis
        args:
        - name: canary-hash
          valueFrom:
            podTemplateHashValue: Latest
      steps:
      - setWeight: 20
      - pause:
          duration: 2m
      - setWeight: 50
      - pause:
          duration: 2m
  selector:
    matchLabels:
      app: ngo-service
  template:
    metadata:
      labels:
        app: ngo-service
    spec:
      serviceAccountName: sa-gke
      initContainers:
      - name: cloud-sql-proxy
        restartPolicy: Always
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
        args:
        - --private-ip
        - --port=$(DB_PORT)
        - $(CLOUDSQL_CONNECTION_NAME)
        env:
        - name: CLOUDSQL_CONNECTION_NAME
          valueFrom:
            secretKeyRef:
              name: ngo-secrets
              key: CLOUDSQL_CONNECTION_NAME
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: ngo-secrets
              key: DB_PORT
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: ngo-service
        image: ngo-service
        imagePullPolicy: Always
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - sleep 10
        startupProbe:
          httpGet:
            path: /health
            port: 8081
          failureThreshold: 30
          periodSeconds: 2
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        ports:
        - containerPort: 8081
        env:
        - name: PORT
          valueFrom:
            secretKeyRef:
              name: ngo-secrets
              key: PORT
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ngo-secrets-job
              key: DATABASE_URL
        - name: NEW_RELIC_LICENSE_KEY
          valueFrom:
            secretKeyRef:
              name: ngo-secrets-job
              key: NEW_RELIC_APIKEY
        - name: NEW_RELIC_APP_NAME
          value: ngo-service
        - name: NEW_RELIC_DISTRIBUTED_TRACING_ENABLED
          value: 'true'
        - name: NEW_RELIC_AI_MONITORING_ENABLED
          value: 'true'
        - name: NEW_RELIC_AI_MONITORING_RECORD_CONTENT_ENABLED
          value: 'true'
        - name: NEW_RELIC_AI_MONITORING_STREAMING_ENABLED
          value: 'true'
        - name: NEW_RELIC_APPLICATION_LOGGING_ENABLED
          value: 'true'
        - name: NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED
          value: 'true'
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: opentelemetry-collector.monitoring-ns.svc.cluster.local:4317
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: grpc
        - name: OTEL_EXPORTER_OTLP_INSECURE
          value: 'true'
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=ngo-ns,deployment.environment=production,service.name=ngo-service
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_METRICS_EXPORTER
          value: otlp
        - name: OTEL_LOGS_EXPORTER
          value: otlp
        - name: OTEL_SERVICE_NAME
          value: ngo-service
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 512m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: ngo-service
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: ngo-service
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
