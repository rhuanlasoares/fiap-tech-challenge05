apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: donation-service
  namespace: donation-ns
  labels:
    app: donation-service
spec:
  replicas: 3
  strategy:
    canary:
      analysis:
        templates:
        - templateName: donation-golden-signals-analysis
        args:
        - name: canary-hash
          valueFrom:
            podTemplateHashValue: Latest
      steps:
      - setWeight: 20
      - pause:
          duration: 2m
      - setWeight: 50
      - pause:
          duration: 2m
  selector:
    matchLabels:
      app: donation-service
  template:
    metadata:
      labels:
        app: donation-service
    spec:
      serviceAccountName: sa-gke
      initContainers:
      - name: cloud-sql-proxy
        restartPolicy: Always
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
        args:
        - --private-ip
        - --port=$(DB_PORT)
        - $(CLOUDSQL_CONNECTION_NAME)
        env:
        - name: CLOUDSQL_CONNECTION_NAME
          valueFrom:
            secretKeyRef:
              name: donation-secrets
              key: CLOUDSQL_CONNECTION_NAME
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: donation-secrets
              key: DB_PORT
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: donation-service
        image: donation-service
        imagePullPolicy: Always
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - sleep 10
        startupProbe:
          httpGet:
            path: /health
            port: 8082
          failureThreshold: 30
          periodSeconds: 2
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8082
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8082
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        ports:
        - containerPort: 8082
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: donation-secrets-job
              key: DATABASE_URL
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: donation-secrets-job
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: donation-secrets-job
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_SQS_URL
          valueFrom:
            secretKeyRef:
              name: donation-secrets-job
              key: AWS_SQS_QUEUE_URL
        - name: NEW_RELIC_LICENSE_KEY
          valueFrom:
            secretKeyRef:
              name: donation-secrets-job
              key: NEW_RELIC_APIKEY
        - name: NEW_RELIC_APP_NAME
          value: donation-service
        - name: PORT
          valueFrom:
            secretKeyRef:
              name: donation-secrets
              key: PORT
        - name: AWS_REGION
          valueFrom:
            secretKeyRef:
              name: donation-secrets
              key: AWS_REGION
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: opentelemetry-collector.monitoring-ns.svc.cluster.local:4317
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: grpc
        - name: OTEL_EXPORTER_OTLP_INSECURE
          value: 'true'
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=donation-ns,deployment.environment=production,service.name=donation-service
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_METRICS_EXPORTER
          value: otlp
        - name: OTEL_LOGS_EXPORTER
          value: otlp
        - name: OTEL_SERVICE_NAME
          value: donation-service
        resources:
          requests:
            cpu: 16m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 256Mi
        securityContext:
          runAsUser: 65532
          runAsGroup: 65532
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: donation-service
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: donation-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
