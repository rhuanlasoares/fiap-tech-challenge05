---
- hosts: localhost
  gather_facts: no
  vars:
    env_dir: "{{ env | default('k8s_kind') }}"
    base_path: "../../../{{ env_dir }}"
  tasks:
    - name: "Iniciando deploy do AIOps Engine no ambiente: {{ env_dir }}"
      debug:
        msg: "Aplicando manifestos de {{ base_path }}/aiops/"

    - name: Aplicar Namespace do AIOps
      ansible.builtin.command:
        kubectl apply -f {{ base_path }}/namespaces/aiops.yaml
      register: output1
      ignore_errors: yes

    - name: Aplicar Manifestos do AIOps via Kustomize (Rollout, Service, RBAC, HealthCheck)
      ansible.builtin.command:
        kubectl apply -k {{ base_path }}/aiops/
      register: output2
      ignore_errors: yes

    - name: Aplicar AIOps HTTPRoute
      ansible.builtin.command:
        kubectl apply -f {{ base_path }}/aiops/aiops-http-route.yaml
      register: output3
      ignore_errors: yes

    - name: Verificar status do deploy
      debug:
        var: output2.stdout_lines
      ignore_errors: yes
