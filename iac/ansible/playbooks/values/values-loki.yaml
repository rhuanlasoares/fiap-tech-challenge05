deploymentMode: SimpleScalable

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 2

  storage:
    type: gcs
    bucketNames:
      chunks: gcs-loki-bucket-solidary-tech-rh
      ruler: gcs-loki-bucket-solidary-tech-rh
      admin: gcs-loki-bucket-solidary-tech-rh
    gcs:
      chunkBufferSize: 0
      requestTimeout: "0s"
      enableHttp2: true

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: gcs
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  limits_config:
    allow_structured_metadata: true
    retention_period: 744h
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32
    max_query_series: 50000

  compactor:
    retention_enabled: true
    delete_request_store: gcs

  querier:
    max_concurrent: 4

resultsCache:
  enabled: true
  allocatedMemory: 512
  allocatedCPU: 150m

chunksCache:
  enabled: true
  allocatedMemory: 1024
  allocatedCPU: 150m
serviceAccount:
  create: false
  name: sa-gke

minio:
  enabled: false

monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: monitoring
  selfMonitoring:
    enabled: false
  lokiCanary:
    enabled: false