# kube-prometheus-stack:
grafana:
  # grafana.ini:
  #   users:
  #   server:
  #     enforce_domain: false

  replicas: 1
  service:
    type: ClusterIP

  persistence:
    enabled: true
    type: pvc
    storageClassName: null   # usa a StorageClass default do cluster; troque se necessário
    accessModes:
      - ReadWriteOnce
    size: 30Gi
  
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki-gateway.monitoring-ns.svc.cluster.local:80
      access: proxy
      basicAuth: false
      isDefault: false
      version: 1
      editable: false
 
additionalScrapeConfigs:
  - job_name: 'otel-collector'
    scrape_interval: 10s
    static_configs:
      - targets: ['opentelemetry-collector.monitoring-ns.svc.cluster.local:8888']

prometheus:
  prometheusSpec:
    replicas: 2
    enableRemoteWriteReceiver: true