<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 930" width="100%" height="100%" style="background:#0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388bfd" />
      <stop offset="50%" stop-color="#8957e5" />
      <stop offset="100%" stop-color="#f0883e" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0e131a" />
    </linearGradient>

    <linearGradient id="blueCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2330" />
      <stop offset="100%" stop-color="#111720" />
    </linearGradient>

    <!-- Filters for Glow / Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bc8cff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3fb950"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d29922"/>
    </marker>
  </defs>

  <!-- Canvas Outer Border -->
  <rect x="15" y="15" width="1110" height="900" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />

  <!-- Title Banner -->
  <g transform="translate(40, 32)">
    <rect x="0" y="0" width="1060" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <rect x="0" y="0" width="6" height="60" rx="3" fill="url(#headerGrad)" />
    <text x="24" y="26" fill="#ffffff" font-size="17" font-weight="700" letter-spacing="0.3">🧠 SOLIDARYTECH — ARQUITETURA AIOPS &amp; CICLO DE VIDA DE INCIDENTES (ITSM)</text>
    <text x="24" y="47" fill="#8b949e" font-size="12">Pipeline Autônomo: Detecção Preditiva (ML), Diagnóstico com Google Gemini GenAI, Self-Healing Kubernetes e Post-Mortem</text>
  </g>

  <!-- ================= STAGE 1: COLETA MULTI-SINAL ================= -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="480" height="235" rx="12" fill="url(#cardGrad1)" stroke="#1f6feb" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="480" height="38" rx="12" fill="#1f6feb" fill-opacity="0.15" />
    <circle cx="22" cy="19" r="8" fill="#1f6feb" />
    <text x="22" y="23" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">1</text>
    <text x="38" y="24" fill="#58a6ff" font-size="14" font-weight="700">1. Coleta Multi-Sinal (Loop a cada 30s)</text>
    <rect x="365" y="8" width="100" height="22" rx="11" fill="#1f6feb" fill-opacity="0.25" stroke="#388bfd" stroke-width="0.8"/>
    <text x="415" y="23" fill="#79c0ff" font-size="10" font-weight="600" text-anchor="middle">TELEMETRIA</text>

    <!-- Signal 1: Prometheus -->
    <g transform="translate(16, 48)">
      <rect x="0" y="0" width="448" height="52" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <rect x="10" y="10" width="32" height="32" rx="6" fill="#e6522c" fill-opacity="0.2" />
      <text x="26" y="31" font-size="16" text-anchor="middle">📊</text>
      <text x="52" y="22" fill="#ffffff" font-size="12" font-weight="700">Prometheus Golden Signals &amp; Recursos</text>
      <text x="52" y="38" fill="#8b949e" font-size="11">Latência, Tráfego, Erros 5xx, Saturação CPU/RAM e Uso de PVCs</text>
    </g>

    <!-- Signal 2: Grafana Loki -->
    <g transform="translate(16, 108)">
      <rect x="0" y="0" width="448" height="52" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <rect x="10" y="10" width="32" height="32" rx="6" fill="#f59e0b" fill-opacity="0.2" />
      <text x="26" y="31" font-size="16" text-anchor="middle">📜</text>
      <text x="52" y="22" fill="#ffffff" font-size="12" font-weight="700">Grafana Loki (Stream de Logs)</text>
      <text x="52" y="38" fill="#8b949e" font-size="11">Captura contínua de Exception, Error, Fatals e Falhas HTTP 500</text>
    </g>

    <!-- Signal 3: K8s API -->
    <g transform="translate(16, 168)">
      <rect x="0" y="0" width="448" height="52" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <rect x="10" y="10" width="32" height="32" rx="6" fill="#326ce5" fill-opacity="0.2" />
      <text x="26" y="31" font-size="16" text-anchor="middle">☸️</text>
      <text x="52" y="22" fill="#ffffff" font-size="12" font-weight="700">Kubernetes API Events</text>
      <text x="52" y="38" fill="#8b949e" font-size="11">OOMKilled, CrashLoopBackOff, FailedScheduling, Evicted Pods</text>
    </g>
  </g>

  <!-- Connect Stage 1 to Stage 2 -->
  <g>
    <path d="M 520, 227 L 610, 227" fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-blue)" />
    <rect x="530" y="212" width="72" height="20" rx="4" fill="#0d1117" stroke="#1f6feb" stroke-width="1" />
    <text x="566" y="226" fill="#79c0ff" font-size="10" font-weight="600" text-anchor="middle">Correlaciona</text>
  </g>

  <!-- ================= STAGE 2: MACHINE LEARNING ================= -->
  <g transform="translate(620, 110)">
    <rect x="0" y="0" width="480" height="235" rx="12" fill="url(#cardGrad1)" stroke="#8957e5" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="480" height="38" rx="12" fill="#8957e5" fill-opacity="0.15" />
    <circle cx="22" cy="19" r="8" fill="#8957e5" />
    <text x="22" y="23" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">2</text>
    <text x="38" y="24" fill="#d2a8ff" font-size="14" font-weight="700">2. Filtro Preditivo com Machine Learning</text>
    <rect x="365" y="8" width="100" height="22" rx="11" fill="#8957e5" fill-opacity="0.25" stroke="#a371f7" stroke-width="0.8"/>
    <text x="415" y="23" fill="#d2a8ff" font-size="10" font-weight="600" text-anchor="middle">PREDICTIVE ML</text>

    <!-- ML 1: Memory Leak -->
    <g transform="translate(16, 48)">
      <rect x="0" y="0" width="448" height="52" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <rect x="10" y="10" width="32" height="32" rx="6" fill="#8957e5" fill-opacity="0.2" />
      <text x="26" y="31" font-size="16" text-anchor="middle">📈</text>
      <text x="52" y="22" fill="#ffffff" font-size="12" font-weight="700">Detecção Linear de Memory Leaks</text>
      <text x="52" y="38" fill="#8b949e" font-size="11">Regressão com np.polyfit calcula taxa de subida e tempo até OOM</text>
    </g>

    <!-- ML 2: PVC Exhaustion -->
    <g transform="translate(16, 108)">
      <rect x="0" y="0" width="448" height="52" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <rect x="10" y="10" width="32" height="32" rx="6" fill="#8957e5" fill-opacity="0.2" />
      <text x="26" y="31" font-size="16" text-anchor="middle">💾</text>
      <text x="52" y="22" fill="#ffffff" font-size="12" font-weight="700">Previsão Estatística de Disco/PVC</text>
      <text x="52" y="38" fill="#8b949e" font-size="11">Projeção de volume esgotado em &lt; 2h antes de corromper o banco</text>
    </g>

    <!-- ML 3: Health Score -->
    <g transform="translate(16, 168)">
      <rect x="0" y="0" width="448" height="52" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <rect x="10" y="10" width="32" height="32" rx="6" fill="#8957e5" fill-opacity="0.2" />
      <text x="26" y="31" font-size="16" text-anchor="middle">🩺</text>
      <text x="52" y="22" fill="#ffffff" font-size="12" font-weight="700">Score de Saúde do Cluster (0 a 100)</text>
      <text x="52" y="38" fill="#8b949e" font-size="11">Ponderação multi-fatorial: latência, taxa 5xx, saturação e alertas</text>
    </g>
  </g>

  <!-- Connect Stage 2 to Stage 3 -->
  <g>
    <path d="M 860, 345 L 860, 380 L 570, 380 L 570, 410" fill="none" stroke="#bc8cff" stroke-width="2" marker-end="url(#arrow-purple)" />
    <rect x="670" y="369" width="180" height="22" rx="5" fill="#0d1117" stroke="#8957e5" stroke-width="1" />
    <text x="760" y="384" fill="#d2a8ff" font-size="10" font-weight="600" text-anchor="middle">⚠️ Risco Preditivo ou Score &lt; 90</text>
  </g>

  <!-- ================= STAGE 3: GENAI RCA ================= -->
  <g transform="translate(100, 418)">
    <rect x="0" y="0" width="940" height="135" rx="12" fill="url(#cardGrad1)" stroke="#39c5bb" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="940" height="36" rx="12" fill="#39c5bb" fill-opacity="0.15" />
    <circle cx="22" cy="18" r="8" fill="#39c5bb" />
    <text x="22" y="22" fill="#0d1117" font-size="11" font-weight="bold" text-anchor="middle">3</text>
    <text x="38" y="23" fill="#56d4c8" font-size="14" font-weight="700">3. Diagnóstico Inteligente de Causa Raiz (RCA) com GenAI</text>
    <rect x="795" y="7" width="130" height="22" rx="11" fill="#39c5bb" fill-opacity="0.2" stroke="#56d4c8" stroke-width="0.8"/>
    <text x="860" y="22" fill="#56d4c8" font-size="10" font-weight="600" text-anchor="middle">DIAGNÓSTICO RCA</text>

    <!-- Main GenAI Engine Box -->
    <g transform="translate(16, 46)">
      <rect x="0" y="0" width="560" height="74" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <rect x="12" y="14" width="46" height="46" rx="8" fill="#39c5bb" fill-opacity="0.2" />
      <text x="35" y="44" font-size="24" text-anchor="middle">🤖</text>
      <text x="70" y="28" fill="#ffffff" font-size="13" font-weight="700">Google Gemini GenAI (Flash-Lite / Pro)</text>
      <text x="70" y="45" fill="#8b949e" font-size="11">Cruza histórico de logs no Loki + anomalia no Prometheus + topologia K8s.</text>
      <text x="70" y="60" fill="#7ee787" font-size="11" font-weight="600">✓ Emite diagnóstico de causa raiz + comando exato de auto-remediação</text>
    </g>

    <!-- Fallback Box -->
    <g transform="translate(590, 46)">
      <rect x="0" y="0" width="334" height="74" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <rect x="12" y="14" width="46" height="46" rx="8" fill="#f0883e" fill-opacity="0.2" />
      <text x="35" y="44" font-size="22" text-anchor="middle">🛡️</text>
      <text x="70" y="28" fill="#ffffff" font-size="12" font-weight="700">Fallback Heurístico Local</text>
      <text x="70" y="45" fill="#8b949e" font-size="11">Motor de regras determinísticas se a API</text>
      <text x="70" y="60" fill="#ffa657" font-size="11">do Gemini estiver sem cota ou offline.</text>
    </g>
  </g>

  <!-- Connect Stage 3 to Stage 4 -->
  <g>
    <path d="M 570, 553 L 570, 595" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)" />
    <rect x="495" y="564" width="150" height="20" rx="4" fill="#0d1117" stroke="#238636" stroke-width="1" />
    <text x="570" y="578" fill="#7ee787" font-size="10" font-weight="600" text-anchor="middle">Plano de Ação Validado</text>
  </g>

  <!-- ================= STAGE 4: REMEDIAÇÃO & ITSM ================= -->
  <g transform="translate(40, 603)">
    <rect x="0" y="0" width="1060" height="145" rx="12" fill="url(#cardGrad1)" stroke="#3fb950" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="1060" height="36" rx="12" fill="#3fb950" fill-opacity="0.15" />
    <circle cx="22" cy="18" r="8" fill="#3fb950" />
    <text x="22" y="22" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">4</text>
    <text x="38" y="23" fill="#7ee787" font-size="14" font-weight="700">4. Execução de Remediação &amp; ITSM Dispatch Simultâneo</text>
    <rect x="915" y="7" width="130" height="22" rx="11" fill="#3fb950" fill-opacity="0.2" stroke="#56d4c8" stroke-width="0.8"/>
    <text x="980" y="22" fill="#7ee787" font-size="10" font-weight="600" text-anchor="middle">AÇÃO &amp; RESOLUÇÃO</text>

    <!-- Action 1: Self-Healing -->
    <g transform="translate(16, 46)">
      <rect x="0" y="0" width="330" height="85" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <rect x="10" y="10" width="32" height="32" rx="6" fill="#238636" fill-opacity="0.2" />
      <text x="26" y="32" font-size="18" text-anchor="middle">⚡</text>
      <text x="50" y="24" fill="#ffffff" font-size="12" font-weight="700">Kubernetes Self-Healing</text>
      <text x="50" y="42" fill="#8b949e" font-size="11">Executa Rollout Restart seguro via K8s API.</text>
      <text x="50" y="58" fill="#8b949e" font-size="11">Respeita PodDisruptionBudgets (PDB).</text>
      <text x="50" y="74" fill="#7ee787" font-size="11" font-weight="600">Tempo de recuperação: &lt; 60 seg</text>
    </g>

    <!-- Action 2: Slack Alert -->
    <g transform="translate(365, 46)">
      <rect x="0" y="0" width="330" height="85" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <rect x="10" y="10" width="32" height="32" rx="6" fill="#4a154b" fill-opacity="0.4" />
      <text x="26" y="32" font-size="18" text-anchor="middle">💬</text>
      <text x="50" y="24" fill="#ffffff" font-size="12" font-weight="700">Slack ITSM Incident Dispatch</text>
      <text x="50" y="42" fill="#8b949e" font-size="11">Envia card de incidente classificado (P1 a P4).</text>
      <text x="50" y="58" fill="#8b949e" font-size="11">Anexa logs, causa raiz e ação tomada.</text>
      <text x="50" y="74" fill="#e3b341" font-size="11" font-weight="600">Cooldown inteligente de 5 min</text>
    </g>

    <!-- Action 3: Web Dashboard -->
    <g transform="translate(714, 46)">
      <rect x="0" y="0" width="330" height="85" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <rect x="10" y="10" width="32" height="32" rx="6" fill="#1f6feb" fill-opacity="0.2" />
      <text x="26" y="32" font-size="18" text-anchor="middle">🖥️</text>
      <text x="50" y="24" fill="#ffffff" font-size="12" font-weight="700">Painel SRE em Tempo Real</text>
      <text x="50" y="42" fill="#8b949e" font-size="11">Exibe Health Score por namespace.</text>
      <text x="50" y="58" fill="#8b949e" font-size="11">APIs /api/health e /api/predictions.</text>
      <text x="50" y="74" fill="#58a6ff" font-size="11" font-weight="600">Histórico de intervenções e métricas</text>
    </g>
  </g>

  <!-- Connect Stage 4 to Stage 5 -->
  <g>
    <path d="M 570, 748 L 570, 788" fill="none" stroke="#d29922" stroke-width="2" marker-end="url(#arrow-gold)" />
    <rect x="475" y="756" width="190" height="20" rx="4" fill="#0d1117" stroke="#d29922" stroke-width="1" />
    <text x="570" y="770" fill="#e3b341" font-size="10" font-weight="600" text-anchor="middle">Cluster Estabilizado (Score &gt;= 95)</text>
  </g>

  <!-- ================= STAGE 5: POST-MORTEM & MTTR ================= -->
  <g transform="translate(100, 793)">
    <rect x="0" y="0" width="940" height="85" rx="12" fill="url(#cardGrad1)" stroke="#d29922" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="940" height="32" rx="12" fill="#d29922" fill-opacity="0.15" />
    <circle cx="22" cy="16" r="8" fill="#d29922" />
    <text x="22" y="20" fill="#0d1117" font-size="11" font-weight="bold" text-anchor="middle">5</text>
    <text x="38" y="21" fill="#e3b341" font-size="13" font-weight="700">5. Estabilização &amp; Post-Mortem Automático (Governança SRE)</text>
    <rect x="805" y="5" width="120" height="22" rx="11" fill="#d29922" fill-opacity="0.2" stroke="#e3b341" stroke-width="0.8"/>
    <text x="865" y="20" fill="#e3b341" font-size="10" font-weight="600" text-anchor="middle">MTTR &lt; 2 MINUTOS</text>

    <!-- Post-Mortem Details -->
    <g transform="translate(16, 40)">
      <rect x="10" y="6" width="30" height="30" rx="6" fill="#d29922" fill-opacity="0.2" />
      <text x="25" y="27" font-size="16" text-anchor="middle">📝</text>
      <text x="52" y="18" fill="#ffffff" font-size="12" font-weight="700">Síntese Automatizada de Post-Mortem no Slack &amp; Auditoria</text>
      <text x="52" y="32" fill="#8b949e" font-size="11">O Gemini gera timeline do incidente, calcula o MTTR exato, detalha a anomalia prevenida e sugere Action Items preventivos de engenharia.</text>
    </g>
  </g>

</svg>