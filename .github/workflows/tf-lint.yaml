name: Terraform Lint & Validate

on:
  push:
    branches:
      - main
    paths:
      - 'iac/terraform/**'
      - '.github/workflows/tf-lint.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'iac/terraform/**'
      - '.github/workflows/tf-lint.yaml'
  workflow_dispatch:

jobs:
  lint-and-validate:
    name: Terraform Format & Validation
    runs-on: ubuntu-latest
    
    # 🔑 1. Permissão necessária para o bot fazer git push
    permissions:
      contents: write

    defaults:
      run:
        working-directory: iac/terraform

    steps:
      # 📥 2. Checkout completo com histórico (fetch-depth: 0)
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Initialize Terraform (Backend Disabled)
        id: init
        run: terraform init -backend=false

      - name: Validate Terraform Code
        id: validate
        run: terraform validate

      # 🎨 3. Formata os arquivos Terraform recursivamente (modifica os arquivos)
      - name: Auto-format Terraform Code
        id: auto_fmt
        run: terraform fmt -recursive

      # 💾 4. Comita e envia as correções com rebase seguro
      - name: 💾 Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git add .
          
          if git diff --staged --quiet; then
            echo "⚠️ No formatting changes needed."
          else
            git commit -m "style(terraform): auto-format files [skip ci]"
            # Sincroniza com o repositório remoto para evitar rejeição de push
            git pull --rebase origin ${{ github.head_ref || github.ref_name }}
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
            echo "✅ Formatted files pushed to repository."
          fi
        
          git status