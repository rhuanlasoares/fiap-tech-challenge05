name: Terraform Lint & Validate

on:
  push:
    branches:
      - main
    paths:
      - 'iac/terraform/**'
      - '.github/workflows/tf-lint.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'iac/terraform/**'
      - '.github/workflows/tf-lint.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-validate:
    name: Terraform Format & Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    defaults:
      run:
        working-directory: iac/terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Initialize Terraform (Backend Disabled)
        id: init
        run: terraform init -backend=false

      - name: Validate Terraform Configuration
        id: validate
        run: terraform validate

      - name: Check Terraform Formatting
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Auto-Format Terraform Files (Push if needed)
        if: steps.fmt.outcome == 'failure' && github.event_name == 'push'
        run: |
          terraform fmt -recursive
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style(terraform): auto-format .tf files via github actions [skip ci]" || echo "No changes to commit"
          git push origin ${{ github.ref_name }}
