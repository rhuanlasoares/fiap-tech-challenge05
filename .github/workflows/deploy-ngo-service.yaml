name: 🔐 Pipeline — ngo-service (Python)

on:
  push:
    branches: [main]
    paths: ["apps/ngo-service/**", ".github/workflows/deploy-ngo-service.yaml"]
  pull_request:
    branches: [main]
    paths: ["apps/ngo-service/**", ".github/workflows/deploy-ngo-service.yaml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  id-token: write
  issues: write
  security-events: write

env:
  SERVICE: ngo-service
  LANGUAGE: python
  PYTHON_VERSION: "3.12.14"
  SERVICE_PATH: apps/ngo-service
  IMAGE_TAG: ${{ github.sha }}

jobs:
  lint:
    name: 🔍 1. Lint & Code Quality
    uses: ./.github/workflows/reusable-lint.yaml
    with:
      language: python
      service_path: apps/ngo-service
      python_version: "3.12.14"
    secrets:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  sca:
    name: 📦 2.1. SCA (Dependencies Vulnerabilities)
    needs: lint
    uses: ./.github/workflows/reusable-sca.yaml
    with:
      language: python
      service_path: apps/ngo-service
      block_on_critical: true
      python_version: "3.12.14"
    secrets:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  sast:
    name: 🔒 2.2. SAST (Static Code Security)
    needs: lint
    uses: ./.github/workflows/reusable-sast.yaml
    with:
      language: python
      service_path: apps/ngo-service
      block_on_critical: true
      python_version: "3.12.14"
    secrets:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  container-scan:
    name: 🐳 3. Container Scan & Local Build
    needs: [sca, sast]
    uses: ./.github/workflows/reusable-container-scan.yaml
    with:
      service_path: apps/ngo-service
      image_name: ngo-service
      image_tag: ${{ github.sha }}
      block_on_critical: true
    secrets:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  dast:
    name: 🌐 4. DAST (OWASP ZAP Dynamic API Scan)
    needs: container-scan
    uses: ./.github/workflows/reusable-dast.yaml
    with:
      service_path: apps/ngo-service
      service_name: ngo-service
      image_name: ngo-service
      image_tag: ${{ github.sha }}
      port: "8081"
      health_endpoint: "/health"
      scan_mode: "api"
      openapi_file: "apps/ngo-service/openapi.yaml"
      block_on_critical: false
      language: "pt-BR"
    secrets:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  build-push-gitops:
    name: 🚀 5. GitOps Delivery & Deploy (ArgoCD)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: [lint, sca, sast, container-scan, dast]
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/build-push-gitops.yaml
    with:
      imageName: southamerica-east1-docker.pkg.dev/naconfeitaria/artreg-ngo-sa/ngo-service
      imageTag: ${{ github.sha }}
      nameService: microsservices/ngo-service
      region: southamerica-east1
      service_path: apps/ngo-service
    secrets:
      PROJECT_ID: ${{ secrets.PROJECT_ID || 'naconfeitaria' }}
      WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
      SERVICE_ACCOUNT: ${{ secrets.SERVICE_ACCOUNT }}
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
