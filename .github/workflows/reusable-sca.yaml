name: ♻️ Reusable — SCA

on:
  workflow_call:
    inputs:
      language:
        required: true
        type: string
      service_path:
        required: true
        type: string
      go_version:
        required: false
        type: string
        default: "1.25"
      python_version:
        required: false
        type: string
        default: "3.13.13"
      block_on_critical:
        required: false
        type: boolean
        default: true
    secrets:
      TOKEN:
        required: true
      GEMINI_API_KEY:
        required: false

jobs:
  sca-go:
    if: inputs.language == 'golang'
    name: SCA Go (${{ inputs.service_path }})
    runs-on: ubuntu-latest
    steps:
      # Clona o código do repositório para a máquina virtual (runner) para permitir a análise
      - uses: actions/checkout@v4

      # Configura o ambiente Go instalando a versão especificada e ativando o cache de dependências
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}
          cache-dependency-path: ${{ inputs.service_path }}/go.sum

      # Baixa os pacotes listados no go.mod para garantir que o projeto esteja pronto para a análise
      - name: Download Dependencies
        working-directory: ${{ inputs.service_path }}
        run: go mod download

      # Executa o Trivy para varrer os arquivos do projeto em busca de vulnerabilidades (CVEs) em dependências de terceiros, falhando o pipeline se achar algo crítico
      - name: Trivy Scan (Go)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ${{ inputs.service_path }}
          format: json
          output: trivy-results.json
          exit-code: 0 # ${{ inputs.block_on_critical && '1' || '0' }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # Executa o OWASP Dependency Check como uma segunda camada de segurança, utilizando a chave do NVD (se fornecida) para mapear falhas com pontuação CVSS 9 ou maior
      - name: OWASP Dependency Check (Go)
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: ${{ inputs.service_path }}
          path: ${{ inputs.service_path }}
          format: 'JSON'
          out: 'reports'
          args: >
            --failOnCVSS 9
            ${{ secrets.TOKEN != '' && format('--nvdApiKey {0}', secrets.TOKEN) || '' }}

      # Analisa o relatório do Trivy com Gemini AI e cria Issue apenas se houver vulnerabilidades
      - name: AI Triage & Issue — Trivy (Go)
        if: always()
        uses: ./.github/actions/ai-issue-analyzer
        with:
          scan-type: sca
          tool-name: "Trivy"
          report-file: "trivy-results.json"
          service-name: "${{ inputs.service_path }}"
          service-path: "${{ inputs.service_path }}"
          gemini-api-key: "${{ secrets.GEMINI_API_KEY }}"
          github-token: "${{ secrets.TOKEN }}"
          output-file: "issue-trivy.md"

      # Analisa o relatório do OWASP com Gemini AI e cria Issue apenas se houver vulnerabilidades
      - name: AI Triage & Issue — OWASP (Go)
        if: always()
        uses: ./.github/actions/ai-issue-analyzer
        with:
          scan-type: sca
          tool-name: "OWASP Dependency-Check"
          report-file: "reports/dependency-check-report.json"
          service-name: "${{ inputs.service_path }}"
          service-path: "${{ inputs.service_path }}"
          gemini-api-key: "${{ secrets.GEMINI_API_KEY }}"
          github-token: "${{ secrets.TOKEN }}"
          output-file: "issue-owasp.md"
      # - name: Create or Update Issue — OWASP (Go)
      #   if: always()
      #   uses: peter-evans/create-issue-from-file@v5
      #   with:
      #     title: '[SCA][Go] OWASP — Vulnerabilidades em ${{ inputs.service_path }}'
      #     content-filepath: issue-owasp.md
      #     labels: security, owasp, sca
      #     token: ${{ secrets.TOKEN }}

  sca-python:
    if: inputs.language == 'python'
    name: SCA Python (${{ inputs.service_path }})
    runs-on: ubuntu-latest
    steps:
      # Clona o repositório para o runner, garantindo acesso aos arquivos Python e listas de dependências
      - uses: actions/checkout@v4

      # Prepara o ambiente instalando a versão correta do Python conforme os parâmetros do workflow
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      # Atualiza o pip e instala as dependências listadas no requirements.txt, preparando o terreno para a varredura
      - name: Install Dependencies
        working-directory: ${{ inputs.service_path }}
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Roda o Trivy no diretório do projeto para encontrar pacotes Python vulneráveis, aplicando a regra de bloqueio se configurado
      - name: Trivy Scan (Python)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ${{ inputs.service_path }}
          format: json
          output: trivy-results.json
          exit-code: 0 # ${{ inputs.block_on_critical && '1' || '0' }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # Utiliza o OWASP Dependency Check para uma validação profunda das bibliotecas, cruzando os dados com a base de vulnerabilidades do governo americano (NVD)
      - name: OWASP Dependency Check (Python)
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: ${{ inputs.service_path }}
          path: ${{ inputs.service_path }}
          format: 'JSON'
          out: 'reports'
          args: >
            --failOnCVSS 9
            ${{ secrets.TOKEN != '' && format('--nvdApiKey {0}', secrets.TOKEN) || '' }}

      # Analisa o relatório do Trivy com Gemini AI e cria Issue apenas se houver vulnerabilidades
      - name: AI Triage & Issue — Trivy (Python)
        if: always()
        uses: ./.github/actions/ai-issue-analyzer
        with:
          scan-type: sca
          tool-name: "Trivy"
          report-file: "trivy-results.json"
          service-name: "${{ inputs.service_path }}"
          service-path: "${{ inputs.service_path }}"
          gemini-api-key: "${{ secrets.GEMINI_API_KEY }}"
          github-token: "${{ secrets.TOKEN }}"
          output-file: "issue-trivy.md"

      # Analisa o relatório do OWASP com Gemini AI e cria Issue apenas se houver vulnerabilidades
      - name: AI Triage & Issue — OWASP (Python)
        if: always()
        uses: ./.github/actions/ai-issue-analyzer
        with:
          scan-type: sca
          tool-name: "OWASP Dependency-Check"
          report-file: "reports/dependency-check-report.json"
          service-name: "${{ inputs.service_path }}"
          service-path: "${{ inputs.service_path }}"
          gemini-api-key: "${{ secrets.GEMINI_API_KEY }}"
          github-token: "${{ secrets.TOKEN }}"
          output-file: "issue-owasp.md"
      # - name: Create or Update Issue — OWASP (Python)
      #   if: always()
      #   uses: peter-evans/create-issue-from-file@v5
      #   with:
      #     title: '[SCA][Python] OWASP — Vulnerabilidades em ${{ inputs.service_path }}'
      #     content-filepath: issue-owasp.md
      #     labels: security, owasp, sca
      #     token: ${{ secrets.TOKEN }}