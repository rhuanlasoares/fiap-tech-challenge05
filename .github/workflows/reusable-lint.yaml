name: ♻️ Reusable — Lint

on:
  workflow_call:
    inputs:
      language:
        required: true
        type: string
      service_path:
        required: true
        type: string
      go_version:
        required: false
        type: string
        default: "1.25"
      python_version:
        required: false
        type: string
        default: "3.13.13"
    secrets:
      TOKEN:
        required: true
      GEMINI_API_KEY:
        required: false

jobs:
  lint-go:
    if: inputs.language == 'golang'
    name: Lint Go (${{ inputs.service_path }})
    runs-on: ubuntu-latest
    steps:
      # Clona o código do repositório para o runner, permitindo modificações com o token fornecido
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}

      # Prepara o ambiente Go instalando a versão especificada nos inputs
      - name: Setup Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ inputs.go_version }}

      # Baixa as dependências do projeto Go baseadas no arquivo go.mod
      - name: Download Dependencies
        working-directory: ${{ inputs.service_path }}
        run: go mod download

      # Formata o código Go automaticamente para o padrão oficial
      - name: Fix formatting
        working-directory: ${{ inputs.service_path }}
        run: gofmt -w .

      # Executa a suíte de lint do Go e tenta corrigir automaticamente problemas menores (--fix)
      - name: Run GolangCI-Lint (auto-fix where possible)
        uses: golangci/golangci-lint-action@v9.2.0
        with:
          working-directory: ${{ inputs.service_path }}
          args: --fix
      
      # Captura o diff gerado pelas correções automáticas antes do commit
      - name: Capturar diff das correções
        if: always()
        id: diff
        run: |
          git diff --unified=3 ${{ inputs.service_path }} > lint-diff.txt || true
          echo "has_diff=$([ -s lint-diff.txt ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT  
      
      # Verifica se houve alterações, faz o commit das correções e envia (push) para a branch main
      - name: 💾 Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git pull --rebase
          git add -u ${{ inputs.service_path }}
          
          if git diff --staged --quiet; then
            echo "⚠️ No changes to commit"
          else
            git commit -m "style(go): code formatted by GitHub Actions [skip ci]"
            git push origin main
            echo "✅ Changes pushed to repository"
          fi
        
          git status

      # Analisa o relatório com Gemini AI e cria Issue apenas se houver correções ou erros relevantes
      - name: AI Triage & Issue — Lint (Go)
        if: always()
        uses: ./.github/actions/ai-issue-analyzer
        with:
          scan-type: lint
          tool-name: "Lint Go"
          report-file: "golangci-lint-output.txt"
          diff-file: "lint-diff.txt"
          service-name: "${{ inputs.service_path }}"
          service-path: "${{ inputs.service_path }}"
          gemini-api-key: "${{ secrets.GEMINI_API_KEY }}"
          github-token: "${{ secrets.TOKEN }}"
          output-file: "issue-lint-go.md"
          
  lint-python:
    if: inputs.language == 'python'
    name: Fix Python (${{ inputs.service_path }})
    runs-on: ubuntu-latest
    steps:
      # Clona o código do repositório garantindo acesso para futuros commits
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}

      # Prepara o ambiente Python instalando a versão especificada nos inputs
      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ inputs.python_version }}

      # Atualiza o pip, instala as ferramentas de lint/formatação e as dependências do projeto
      - name: Install Tools
        working-directory: ${{ inputs.service_path }}
        run: |
          pip install --upgrade pip
          pip install black isort flake8 pylint
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Aplica o formatador de código Black e ordena as importações automaticamente com o isort
      - name: Auto format (black + isort)
        working-directory: ${{ inputs.service_path }}
        run: |
          black .
          isort .

      # Executa a validação de estilo e qualidade, ignorando erros que travariam o pipeline (|| true)
      - name: Lint validation
        working-directory: ${{ inputs.service_path }}
        run: |
          flake8 . --max-line-length=120 > flake8-output.txt 2>&1 || true
          pylint **/*.py > pylint-output.txt 2>&1 || true
          cat flake8-output.txt pylint-output.txt > lint-errors.txt || true
      
      # Captura o diff gerado pelas correções automáticas antes do commit
      - name: Capturar diff das correções
        if: always()
        id: diff
        run: |
          git diff --unified=3 ${{ inputs.service_path }} > lint-diff.txt || true
          echo "has_diff=$([ -s lint-diff.txt ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT  
      
      # Confere se os formatadores alteraram arquivos, cria o commit automatizado e faz o push
      - name: 💾 Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          git pull --rebase
          git add -u ${{ inputs.service_path }}
          
          if git diff --staged --quiet; then
            echo "⚠️ No changes to commit"
          else
            git commit -m "style(python): code formatted by GitHub Actions [skip ci]"
            git push origin main
            echo "✅ Changes pushed to repository"
          fi
        
          git status

      # Analisa o relatório com Gemini AI e cria Issue apenas se houver correções ou erros relevantes
      - name: AI Triage & Issue — Lint (Python)
        if: always()
        uses: ./.github/actions/ai-issue-analyzer
        with:
          scan-type: lint
          tool-name: "Lint Python"
          report-file: "${{ inputs.service_path }}/lint-errors.txt"
          diff-file: "lint-diff.txt"
          service-name: "${{ inputs.service_path }}"
          service-path: "${{ inputs.service_path }}"
          gemini-api-key: "${{ secrets.GEMINI_API_KEY }}"
          github-token: "${{ secrets.TOKEN }}"
          output-file: "issue-lint-python.md"

      # Limpa relatórios temporários de lint para evitar arquivos residuais
      - name: 🧹 Cleanup temporary reports
        if: always()
        run: |
          rm -f ${{ inputs.service_path }}/flake8-output.txt \
                ${{ inputs.service_path }}/pylint-output.txt \
                ${{ inputs.service_path }}/lint-errors.txt \
                lint-diff.txt issue-lint-python.md || true

