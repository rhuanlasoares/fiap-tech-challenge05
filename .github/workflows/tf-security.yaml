name: 🛡️ Pipeline — Terraform IaC (Lint, Validate & Security)

on:
  push:
    branches:
      - main
    paths:
      - 'iac/terraform/**'
      - '.github/workflows/tf-security.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'iac/terraform/**'
      - '.github/workflows/tf-security.yaml'
  workflow_dispatch:
    inputs:
      block_on_critical:
        description: "Bloquear a pipeline se houver vulnerabilidades HIGH ou CRITICAL?"
        type: boolean
        required: true
        default: true
      language:
        description: "Idioma para a análise de IA e geração da Issue"
        type: choice
        options:
          - pt-BR
          - en-US
        required: false
        default: pt-BR
      auto_remediate:
        description: "Habilitar auto-remediacao de IaC com abertura de Pull Request via IA?"
        type: boolean
        required: false
        default: true
      dry_run:
        description: "Simular a remediacao sem criar branch ou PR?"
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  DEFAULT_BLOCK_ON_CRITICAL: "true"
  BLOCK_ON_CRITICAL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.block_on_critical || vars.TF_BLOCK_ON_CRITICAL || 'true' }}
  LANGUAGE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.language || vars.TF_SCAN_LANGUAGE || 'pt-BR' }}

jobs:
  lint-and-validate:
    name: 🔍 Terraform Format & Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    defaults:
      run:
        working-directory: iac/terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Initialize Terraform (Backend Disabled)
        id: init
        run: terraform init -backend=false

      - name: Validate Terraform Configuration
        id: validate
        run: terraform validate

      - name: Check Terraform Formatting
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Auto-Format Terraform Files (Push if needed)
        if: steps.fmt.outcome == 'failure' && github.event_name == 'push'
        run: |
          terraform fmt -recursive
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style(terraform): auto-format .tf files via github actions [skip ci]" || echo "No changes to commit"
          git push origin ${{ github.ref_name }}

  tf-security:
    name: 🛡️ Terraform Security (Trivy & TFSec)
    needs: [lint-and-validate]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Executar Trivy IaC Scan (JSON para IA)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: iac/terraform
          format: json
          output: iac/terraform/trivy-iac-results.json
          severity: LOW,MEDIUM,HIGH,CRITICAL
          exit-code: 0

      - name: Exibir Relatório Resumido no Log
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: iac/terraform
          format: table
          severity: LOW,MEDIUM,HIGH,CRITICAL
          exit-code: 0

      - name: Triagem com IA e Criação de Issue (Google Gemini)
        id: ai_issue
        if: always()
        uses: ./.github/actions/ai-issue-analyzer
        with:
          scan-type: iac
          tool-name: "Trivy IaC (TFSec)"
          report-file: "iac/terraform/trivy-iac-results.json"
          service-name: "iac-terraform"
          service-path: "iac/terraform"
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-file: "iac/terraform/issue-tf-security.md"
          language: ${{ env.LANGUAGE }}

      - name: Auto-Remediacao de IaC com IA (Gemini)
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.auto_remediate == 'true') || (github.event_name == 'pull_request') || vars.TF_AUTO_REMEDIATE == 'true' }}
        uses: ./.github/actions/ai-code-remediator
        with:
          scan-type: iac
          tool-name: "Trivy IaC (TFSec)"
          report-file: "iac/terraform/trivy-iac-results.json"
          service-name: "iac-terraform"
          service-path: "iac/terraform"
          test-command: "terraform -chdir=iac/terraform validate"
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          language: ${{ env.LANGUAGE }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}

      - name: Avaliar Severidade e Bloqueio Parametrizado
        id: check-blocking
        if: always()
        shell: bash
        run: |
          echo "=========================================================="
          echo "       Governança de Segurança Terraform (IaC)            "
          echo "=========================================================="
          echo " Severidade Máxima : ${{ steps.ai_issue.outputs.max-severity || 'NENHUMA' }}"
          echo " Issue Criada/Mod. : ${{ steps.ai_issue.outputs.create-issue || 'false' }}"
          echo " Bloqueio Ativo    : ${{ env.BLOCK_ON_CRITICAL }}"
          echo " Idioma Selecionado: ${{ env.LANGUAGE }}"
          echo "=========================================================="

          MAX_SEV="${{ steps.ai_issue.outputs.max-severity }}"
          CREATE_ISSUE="${{ steps.ai_issue.outputs.create-issue }}"

          if [ "$CREATE_ISSUE" = "true" ] && { [ "$MAX_SEV" = "CRITICAL" ] || [ "$MAX_SEV" = "HIGH" ]; }; then
            if [ "${{ env.BLOCK_ON_CRITICAL }}" = "true" ]; then
              echo "❌ BLOQUEIO: Achados de severidade $MAX_SEV detectados no código Terraform."
              echo "   A pipeline foi interrompida para evitar a criação de infraestrutura vulnerável."
              echo "   Consulte a Issue aberta no GitHub para analisar o plano de remediação e o código sugerido."
              exit 1
            else
              echo "⚠️ AVISO: Achados de severidade $MAX_SEV detectados, porém o bloqueio está DESATIVADO."
              echo "   Consulte a Issue gerada pela IA para planejar a correção dos recursos."
            fi
          else
            echo "✅ Análise de segurança concluída sem violações impeditivas."
          fi
