name: 🔐 Pipeline — donation-service (Golang)

on:
  push:
    branches: [main]
    paths: ["apps/donation-service/**"]
  pull_request:
    branches: [main]
    paths: ["apps/donation-service/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  SERVICE: donation-service
  LANGUAGE: golang
  GO_VERSION: "1.25"
  SERVICE_PATH: apps/donation-service
  IMAGE_TAG: ${{ github.sha }}

jobs:
  lint:
    name: 🔍 Lint
    uses: ./.github/workflows/reusable-lint.yaml
    with:
      language: golang
      service_path: apps/donation-service
      go_version: "1.25"
    secrets:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sca:
    name: 📦 SCA
    needs: lint
    uses: ./.github/workflows/reusable-sca.yaml
    with:
      language: golang
      service_path: apps/donation-service
      block_on_critical: true
      go_version: "1.25"
    secrets:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: 🔒 SAST
    needs: lint
    uses: ./.github/workflows/reusable-sast.yaml
    with:
      language: golang
      service_path: apps/donation-service
      block_on_critical: true
      go_version: "1.25"
    secrets:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    name: 🐳 Container Scan & Local Build
    needs: [sca, sast]
    uses: ./.github/workflows/reusable-container-scan.yaml
    with:
      service_path: apps/donation-service
      image_name: donation-service
      image_tag: ${{ github.sha }}
      block_on_critical: true
    secrets:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}

