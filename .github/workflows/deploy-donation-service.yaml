name: 🔐 Pipeline — donation-service (Golang)

on:
  push:
    branches: [main]
    paths: ["apps/donation-service/**"]
  pull_request:
    branches: [main]
    paths:
      - "apps/donation-service/**"
      - ".github/workflows/deploy-donation-service.yaml"
      - ".github/workflows/reusable-sast.yaml"
      - ".github/actions/ai-code-remediator/**"
  workflow_dispatch:
    inputs:
      auto_remediate:
        description: "Habilitar auto-remediacao de codigo com IA?"
        type: boolean
        required: false
        default: true
      dry_run:
        description: "Simular a remediacao sem criar branch ou PR?"
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  id-token: write
  issues: write
  security-events: write

env:
  SERVICE: donation-service
  LANGUAGE: golang
  GO_VERSION: "1.26"
  SERVICE_PATH: apps/donation-service
  IMAGE_TAG: ${{ github.sha }}

jobs:
  lint:
    name: 🔍 Lint
    uses: ./.github/workflows/reusable-lint.yaml
    with:
      language: golang
      service_path: apps/donation-service
      go_version: "1.26"
    secrets:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  sca:
    name: 📦 SCA
    needs: lint
    uses: ./.github/workflows/reusable-sca.yaml
    with:
      language: golang
      service_path: apps/donation-service
      block_on_critical: true
      go_version: "1.26"
    secrets:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  sast:
    name: 🔒 SAST
    needs: lint
    uses: ./.github/workflows/reusable-sast.yaml
    with:
      language: golang
      service_path: apps/donation-service
      block_on_critical: true
      go_version: "1.26"
      auto_remediate: true
      dry_run: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' || false }}
    secrets:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  container-scan:
    name: 🐳 Container Scan & Local Build
    needs: [sca, sast]
    uses: ./.github/workflows/reusable-container-scan.yaml
    with:
      service_path: apps/donation-service
      image_name: donation-service
      image_tag: ${{ github.sha }}
      block_on_critical: true
    secrets:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  dast:
    name: 🌐 DAST (OWASP ZAP)
    needs: container-scan
    uses: ./.github/workflows/reusable-dast.yaml
    with:
      service_path: apps/donation-service
      service_name: donation-service
      image_name: donation-service
      image_tag: ${{ github.sha }}
      port: "8082"
      health_endpoint: "/health"
      scan_mode: "api"
      openapi_file: "apps/donation-service/openapi.yaml"
      block_on_critical: false
      language: "pt-BR"
    secrets:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

