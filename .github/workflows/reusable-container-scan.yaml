name: ♻️ Reusable — Container Image Scan (Trivy)

on:
  workflow_call:
    inputs:
      service_path:
        description: "Caminho relativo do serviço (ex: auth-service)"
        required: true
        type: string
      image_name:
        description: "Nome da imagem Docker (ex: auth-service)"
        required: true
        type: string
      image_tag:
        description: "Tag da imagem (ex: abc1234)"
        required: true
        type: string
      block_on_critical:
        description: "Falhar o pipeline se vulnerabilidade CRÍTICA/HIGH for encontrada"
        required: false
        type: boolean
        default: true
    secrets:
      TOKEN:
        required: true
      GEMINI_API_KEY:
        required: false

jobs:
  container-scan:
    name: Container Scan — ${{ inputs.image_name }}:${{ inputs.image_tag }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: "Build — Construir imagem Docker"
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.service_path }}
          push: false
          load: true
          tags: ${{ inputs.image_name }}:${{ inputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Analisa o Dockerfile em busca de misconfigurations e salva o resultado em JSON
      - name: "Trivy — Scan de misconfigurations no Dockerfile"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: ${{ inputs.service_path }}
          format: json
          output: trivy-config-${{ inputs.image_name }}.json
          severity: HIGH,CRITICAL
          exit-code: 0 # ${{ inputs.block_on_critical && '1' || '0' }}

      # Realiza o scan de vulnerabilidades (CVEs) na imagem Docker construída e salva o resultado em JSON
      - name: "Trivy — Gerar relatório JSON de vulnerabilidades"
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          scan-type: image
          image-ref: ${{ inputs.image_name }}:${{ inputs.image_tag }}
          format: json
          output: trivy-report-${{ inputs.image_name }}.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0 # ${{ inputs.block_on_critical && '1' || '0' }}

      # Analisa misconfigurations do Dockerfile com Gemini AI e cria Issue apenas se houver problemas
      - name: AI Triage & Issue — Trivy Dockerfile Misconfigurations
        if: always()
        uses: ./.github/actions/ai-issue-analyzer
        with:
          scan-type: container
          tool-name: "Trivy Misconfigurations"
          report-file: "trivy-config-${{ inputs.image_name }}.json"
          service-name: "${{ inputs.image_name }}"
          service-path: "${{ inputs.service_path }}"
          gemini-api-key: "${{ secrets.GEMINI_API_KEY }}"
          github-token: "${{ secrets.TOKEN }}"
          output-file: "issue-config.md"

      # Analisa vulnerabilidades da imagem com Gemini AI e cria Issue apenas se houver falhas
      - name: AI Triage & Issue — Trivy Image Vulnerabilities
        if: always()
        uses: ./.github/actions/ai-issue-analyzer
        with:
          scan-type: container
          tool-name: "Trivy Image Scan"
          report-file: "trivy-report-${{ inputs.image_name }}.json"
          service-name: "${{ inputs.image_name }}"
          service-path: "${{ inputs.service_path }}"
          gemini-api-key: "${{ secrets.GEMINI_API_KEY }}"
          github-token: "${{ secrets.TOKEN }}"
          output-file: "issue-image.md"
