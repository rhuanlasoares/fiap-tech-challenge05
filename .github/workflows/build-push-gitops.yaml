name: Reusable — Build and Push Image

on:
  workflow_call:
    inputs:
      imageName:
        required: true
        type: string
      imageTag:
        required: true
        type: string
      nameService:
        required: true
        type: string
      region:
        required: true
        type: string 
      service_path:
        required: true
        type: string
    secrets:
      PROJECT_ID:
        required: true
      WORKLOAD_IDENTITY_PROVIDER:
        required: true
      SERVICE_ACCOUNT:
        required: true
      TOKEN:
        required: false

jobs:
  build-and-push-image:
    name: Build and Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: GCP Authentication via WIF
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.PROJECT_ID }}
          token_format: "access_token"
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.region }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image to GAR
        id: push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ inputs.service_path }}
          push: true
          tags: | 
            ${{ inputs.imageName }}:${{ inputs.imageTag }}
            ${{ inputs.imageName }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_COMMIT=${{ inputs.imageTag }}
            GIT_BRANCH=${{ github.ref_name }}

      - name: 📊 Build Summary
        run: |
          echo "## 🐳 Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ inputs.imageName }}:${{ inputs.imageTag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Built and Pushed to GAR" >> $GITHUB_STEP_SUMMARY

  update-gitops:
    name: 📝 Update GitOps Manifests
    runs-on: ubuntu-latest
    needs: build-and-push-image
    timeout-minutes: 10
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN || github.token }}
          fetch-depth: 0
      
      - name: 🔧 Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.4.1"
      
      - name: 📝 Update image tag in kustomization
        run: |
          cd k8s/microsservices/${{ inputs.nameService }}

          echo "🔄 Updating image tag to: ${{ inputs.imageTag }}"
          kustomize edit set image ${{ inputs.nameService }}=${{ inputs.imageName }}:${{ inputs.imageTag }}
          
          echo "✅ Kustomization updated"
          cat kustomization.yaml

      - name: ✅ Validate Kubernetes manifests
        run: |
          echo "🔍 Validating manifests..."
          cd k8s/microsservices/${{ inputs.nameService }}
          kustomize build . > /tmp/manifests.yaml
          echo "✅ Manifests are valid"
      
      - name: 💾 Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          git add k8s/microsservices/${{ inputs.nameService }}/kustomization.yaml
          
          if git diff --staged --quiet; then
            echo "⚠️ No changes to commit"
          else
            git commit -m "🚀 Update production image to ${{ inputs.imageTag }} [skip ci]"
            
            MAX_RETRIES=5
            RETRY_DELAY=3
            PUSHED=false

            for i in $(seq 1 $MAX_RETRIES); do
              echo "🔄 [Tentativa $i/$MAX_RETRIES] Sincronizando com origin main e enviando commit..."
              if git pull --rebase origin main && git push origin main; then
                echo "✅ Changes pushed to repository"
                PUSHED=true
                break
              fi
              echo "⚠️ Push concorrente detectado. Abortando rebase e aguardando ${RETRY_DELAY}s..."
              git rebase --abort 2>/dev/null || true
              sleep $RETRY_DELAY
              RETRY_DELAY=$((RETRY_DELAY * 2))
            done

            if [ "$PUSHED" = false ]; then
              echo "❌ Falha ao enviar alterações após $MAX_RETRIES tentativas concorrentes."
              exit 1
            fi
          fi
