name: 📡 GCP Status Checker — Disaster Recovery Watchdog

on:
  # Agendamento desativado temporariamente. Descomente para reativar o monitoramento automático a cada 5 minutos:
  # schedule:
  #   - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      auto_trigger:
        description: "Executar Failover/Switchback automaticamente (Auto-Trigger)?"
        required: true
        type: boolean
        default: false
      require_manual_confirmation:
        description: "Exigir confirmação manual (Segurança SRE)? Se 'true', apenas notifica no Slack com link."
        required: true
        type: boolean
        default: true
      dry_run:
        description: "Executar em modo Simulação (Dry-Run)?"
        required: true
        type: boolean
        default: false
      simulation_mode:
        description: "Ativar simulação de falha artificial para teste?"
        required: true
        type: boolean
        default: false
      simulated_service:
        description: "Serviço para simular falha (ex: 'Cloud SQL' ou 'Google Kubernetes Engine' ou 'all'):"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
  actions: write

jobs:
  watchdog:
    name: 🛡️ Analisar Status GCP & Avaliar DR
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "apps/gcp-status-checker/requirements.txt"

      - name: 📦 Instalar Dependências
        run: |
          pip install -r apps/gcp-status-checker/requirements.txt

      - name: 🔑 Autenticação no GCP via WIF (Acesso ao Bucket GCS de Estado)
        uses: google-github-actions/auth@v3
        continue-on-error: true
        with:
          project_id: ${{ secrets.PROJECT_ID || 'naconfeitaria' }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT || 'sa-wifederation-fiap@naconfeitaria.iam.gserviceaccount.com' }}

      - name: 📡 Executar GCP Status Watchdog
        id: run_watchdog
        env:
          TARGET_SERVICES: "Cloud SQL,Google Kubernetes Engine"
          TARGET_REGION: "southamerica-east1"
          CONSECUTIVE_OUTAGE_THRESHOLD: "3"
          CONSECUTIVE_HEALTHY_THRESHOLD: "3"
          GCS_STATE_BUCKET: ${{ secrets.GCS_STATE_BUCKET || 'gcs-velero-bucket-solidary-tech-rh' }}
          GCS_STATE_FILE: "gcp-status-checker-state.json"
          AUTO_TRIGGER_DR: ${{ inputs.auto_trigger || 'false' }}
          REQUIRE_MANUAL_CONFIRMATION: ${{ inputs.require_manual_confirmation || 'true' }}
          DR_DRY_RUN: ${{ inputs.dry_run || 'false' }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.DR_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.WEBHOOK_SLACK }}
          SIMULATION_MODE: ${{ inputs.simulation_mode || 'false' }}
          SIMULATED_OUTAGE_SERVICES: ${{ inputs.simulated_service || '' }}
        run: |
          python3 apps/gcp-status-checker/main.py

      - name: 📊 Resumo Executivo da Verificação (Step Summary)
        if: always()
        run: |
          echo "## 📡 Relatório do GCP Status Watchdog" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parâmetro | Configuração |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Região Monitorada** | \`southamerica-east1\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Serviços Alvo** | \`Cloud SQL\`, \`Google Kubernetes Engine\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Limiar de Falhas Consecutivas** | \`3 verificações\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Limiar de Estabilidade (Switchback)** | \`3 verificações\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Auto-Trigger DR** | \`${{ inputs.auto_trigger || 'false' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Validação Manual Requerida** | \`${{ inputs.require_manual_confirmation || 'true' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Armazenamento de Estado** | GCS (\`gcp-status-checker-state.json\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Modo Simulação** | \`${{ inputs.simulation_mode || 'false' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Verifique os logs detalhados do step acima para conferir os contadores de saúde e estado da topologia." >> $GITHUB_STEP_SUMMARY
