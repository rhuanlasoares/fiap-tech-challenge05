name: 🚨 DR — Migrate Images (South America ➔ US)

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Serviço para migrar (ou 'all' para todos)"
        required: true
        type: choice
        default: "all"
        options:
          - all
          - ngo-service
          - donation-service
          - volunteer-service
      tag:
        description: "Tag da imagem (ex: 'latest', tag de commit SHA, ou 'all')"
        required: true
        type: string
        default: "latest"
      source_region:
        description: "Região de origem (GCP South America)"
        required: true
        type: string
        default: "southamerica-east1"
      dest_region:
        description: "Região de destino (Disaster Recovery)"
        required: true
        type: string
        default: "us-east1"
      project_id:
        description: "GCP Project ID (deixe em branco para usar secret ou ces-igniteprogram)"
        required: false
        type: string
        default: "ces-igniteprogram"

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ github.event.inputs.project_id || secrets.PROJECT_ID || 'ces-igniteprogram' }}
  SOURCE_REGION: ${{ github.event.inputs.source_region || 'southamerica-east1' }}
  DEST_REGION: ${{ github.event.inputs.dest_region || 'us-east1' }}
  IMAGE_TAG: ${{ github.event.inputs.tag || 'latest' }}
  SELECTED_SERVICE: ${{ github.event.inputs.service || 'all' }}

jobs:
  migrate-docker-images:
    name: 🔄 Migrate Images (DR)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 GCP Authentication (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          token_format: "access_token"
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: ☁️ Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: 🔑 Login to Source Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.SOURCE_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: 🔑 Login to Destination Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DEST_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: 🚀 Migrate Docker Images to Destination Region
        id: migration
        run: |
          set -e

          echo "=========================================="
          echo "🚨 DISASTER RECOVERY - IMAGE MIGRATION 🚨"
          echo "Source Region:      ${SOURCE_REGION}"
          echo "Destination Region: ${DEST_REGION}"
          echo "Project ID:         ${PROJECT_ID}"
          echo "Target Service:     ${SELECTED_SERVICE}"
          echo "Target Tag:         ${IMAGE_TAG}"
          echo "=========================================="

          # Mapeamento dos serviços e seus respectivos repositórios
          # Formato: "nome_servico:repo_origem:repo_destino"
          SERVICES_CONFIG=(
            "ngo-service:artreg-ngo-sa:artreg-ngo-us"
            "donation-service:artreg-donation-sa:artreg-donation-us"
            "volunteer-service:artreg-volunteer-sa:artreg-volunteer-us"
          )

          # Inicializa resumo do GitHub Step Summary
          echo "## 🚨 Disaster Recovery — Relatório de Migração de Imagens" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parâmetro | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Origem** | \`${SOURCE_REGION}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Destino** | \`${DEST_REGION}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Projeto** | \`${PROJECT_ID}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Filtro de Tag** | \`${IMAGE_TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Detalhes das Imagens Migradas" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Serviço | Imagem Origem | Imagem Destino | Tag | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY

          TOTAL_MIGRATED=0
          TOTAL_ERRORS=0

          for item in "${SERVICES_CONFIG[@]}"; do
            IFS=':' read -r SVC_NAME SRC_REPO DST_REPO <<< "$item"

            # Se o usuário escolheu um serviço específico, pula os demais
            if [ "$SELECTED_SERVICE" != "all" ] && [ "$SELECTED_SERVICE" != "$SVC_NAME" ]; then
              continue
            fi

            echo ""
            echo "--------------------------------------------------------"
            echo "📦 Processando serviço: $SVC_NAME"
            echo "--------------------------------------------------------"

            SRC_BASE="${SOURCE_REGION}-docker.pkg.dev/${PROJECT_ID}/${SRC_REPO}/${SVC_NAME}"
            DST_BASE="${DEST_REGION}-docker.pkg.dev/${PROJECT_ID}/${DST_REPO}/${SVC_NAME}"

            # Determina lista de tags a migrar
            TAGS_TO_MIGRATE=()

            if [ "$IMAGE_TAG" == "all" ]; then
              echo "🔍 Listando todas as tags disponíveis na origem via gcloud..."
              TAGS_OUTPUT=$(gcloud artifacts docker tags list "${SRC_BASE}" --format="value(tag)" 2>/dev/null || true)
              if [ -n "$TAGS_OUTPUT" ]; then
                while IFS= read -r tag_item; do
                  [ -n "$tag_item" ] && TAGS_TO_MIGRATE+=("$tag_item")
                done <<< "$TAGS_OUTPUT"
              else
                echo "⚠️ Nenhuma tag encontrada ou repositório não acessível para ${SRC_BASE}, tentando 'latest'..."
                TAGS_TO_MIGRATE+=("latest")
              fi
            else
              TAGS_TO_MIGRATE+=("$IMAGE_TAG")
            fi

            echo "Tags a migrar para ${SVC_NAME}: ${TAGS_TO_MIGRATE[*]}"

            for tag in "${TAGS_TO_MIGRATE[@]}"; do
              SRC_IMG="${SRC_BASE}:${tag}"
              DST_IMG="${DST_BASE}:${tag}"

              echo "⬇️  [1/3] Puxando imagem: ${SRC_IMG}"
              if docker pull "${SRC_IMG}"; then
                echo "🏷️  [2/3] Criando tag de destino: ${DST_IMG}"
                docker tag "${SRC_IMG}" "${DST_IMG}"

                echo "⬆️  [3/3] Enviando para destino: ${DST_IMG}"
                if docker push "${DST_IMG}"; then
                  echo "✅ Sucesso ao migrar ${SRC_IMG} -> ${DST_IMG}"
                  echo "| \`${SVC_NAME}\` | \`${SRC_IMG}\` | \`${DST_IMG}\` | \`${tag}\` | ✅ Sucesso |" >> $GITHUB_STEP_SUMMARY
                  TOTAL_MIGRATED=$((TOTAL_MIGRATED + 1))
                else
                  echo "❌ Erro ao enviar imagem ${DST_IMG} para o destino!"
                  echo "| \`${SVC_NAME}\` | \`${SRC_IMG}\` | \`${DST_IMG}\` | \`${tag}\` | ❌ Falha no Push |" >> $GITHUB_STEP_SUMMARY
                  TOTAL_ERRORS=$((TOTAL_ERRORS + 1))
                fi
              else
                echo "❌ Falha ao puxar imagem de origem ${SRC_IMG}!"
                echo "| \`${SVC_NAME}\` | \`${SRC_IMG}\` | \`${DST_IMG}\` | \`${tag}\` | ❌ Falha no Pull |" >> $GITHUB_STEP_SUMMARY
                TOTAL_ERRORS=$((TOTAL_ERRORS + 1))
              fi
            done
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Resumo" >> $GITHUB_STEP_SUMMARY
          echo "- **Total migrado com sucesso:** ${TOTAL_MIGRATED}" >> $GITHUB_STEP_SUMMARY
          echo "- **Total de falhas:** ${TOTAL_ERRORS}" >> $GITHUB_STEP_SUMMARY

          if [ $TOTAL_ERRORS -gt 0 ]; then
            echo ""
            echo "⚠️ Migração finalizada com $TOTAL_ERRORS erro(s)."
            exit 1
          fi

          echo ""
          echo "🎉 Migração concluída com sucesso! Total de imagens migradas: $TOTAL_MIGRATED"