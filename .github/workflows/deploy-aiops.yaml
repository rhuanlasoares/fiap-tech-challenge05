name: 🔐 Pipeline — aiops-engine (Python)

on:
  push:
    branches: [main]
    paths: ["apps/aiops-engine/**"]
  pull_request:
    branches: [main]
    paths:
      - "apps/aiops-engine/**"
      - ".github/workflows/deploy-aiops.yaml"
      - ".github/workflows/reusable-sast.yaml"
      - ".github/actions/ai-code-remediator/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  id-token: write
  issues: write
  security-events: write

env:
  SERVICE: aiops-engine
  LANGUAGE: python
  PYTHON_VERSION: "3.12.14"
  SERVICE_PATH: apps/aiops-engine
  IMAGE_TAG: ${{ github.sha }}

jobs:
  lint:
    name: 🔍 Lint
    uses: ./.github/workflows/reusable-lint.yaml
    with:
      language: python
      service_path: apps/aiops-engine
      python_version: "3.12.14"
    secrets:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  sca:
    name: 📦 SCA
    needs: lint
    uses: ./.github/workflows/reusable-sca.yaml
    with:
      language: python
      service_path: apps/aiops-engine
      block_on_critical: true
      python_version: "3.12.14"
    secrets:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  sast:
    name: 🔒 SAST
    needs: lint
    uses: ./.github/workflows/reusable-sast.yaml
    with:
      language: python
      service_path: apps/aiops-engine
      block_on_critical: true
      python_version: "3.12.14"
      auto_remediate: true
    secrets:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  container-scan:
    name: 🐳 Container Scan & Local Build
    needs: [sca, sast]
    uses: ./.github/workflows/reusable-container-scan.yaml
    with:
      service_path: apps/aiops-engine
      image_name: aiops-engine
      image_tag: ${{ github.sha }}
      block_on_critical: true
    secrets:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  dast:
    name: 🌐 DAST (OWASP ZAP)
    needs: container-scan
    uses: ./.github/workflows/reusable-dast.yaml
    with:
      service_path: apps/aiops-engine
      service_name: aiops-engine
      image_name: aiops-engine
      image_tag: ${{ github.sha }}
      port: "8000"
      health_endpoint: "/health"
      scan_mode: "api"
      openapi_file: "http://127.0.0.1:8000/openapi.json"
      block_on_critical: false
      language: "pt-BR"
    secrets:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

